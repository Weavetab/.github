name: Bug Report
description: Report a reproducible bug or unexpected behavior in the WeaveTab ecosystem.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue. Please provide actionable, mechanism-first reproduction details so maintainers can reproduce and address the issue swiftly.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component / Package
      description: Select the primary package or component where the issue occurs.
      options:
        - "@weavetab/mcp (Core MCP Server)"
        - "@weavetab/sdk (TypeScript SDK)"
        - "@weavetab/skills (Operational Skills)"
        - "WeaveTab Studio (DevTools Workspace)"
        - "WeaveTab Companion Extension"
        - "Documentation / Platform Site"
        - "Other / Cross-Cutting"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package / Runtime Version
      description: "Exact version or tag (e.g. @weavetab/mcp@2.5.0-beta.3, git sha, or output of npm list)."
      placeholder: "e.g. 2.5.0-beta.3"
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: AI Agent Runtime / Host Client
      description: Which agent environment is executing WeaveTab MCP?
      options:
        - "Claude Desktop"
        - "Antigravity"
        - "Cursor"
        - "Cline"
        - "Roo Code / Roo Cline"
        - "Direct MCP Client / Custom Script"
        - "Other"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating System & Browser Engine
      description: "Host OS, Node.js version, and Chromium browser version."
      placeholder: "Windows 11 / Node 20.12.0 / Chrome 128.0.6613.120"
    validations:
      required: true

  - type: input
    id: tools
    attributes:
      label: Specific MCP Tools or SDK APIs Involved
      description: Tools called when error occurred (e.g. browser_click, browser_type_secret, definePlugin, browser_map).
      placeholder: "e.g. browser_click, browser_fill"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear, concise summary of the failure or unexpected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Deterministic steps, script, or command sequence to reproduce the issue.
      placeholder: |
        1. Initialize server via `npx @weavetab/mcp`
        2. Agent calls tool `browser_click` with selector `...`
        3. Observe protocol error or timeout
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened according to protocol specification or API docs.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred (e.g., CDP socket drop, unhandled promise, incorrect DOM delta).
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / CDP Traces
      description: Paste any relevant terminal logs, CDP protocol frames, or stack traces (redact sensitive tokens).
      render: shell

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Verification
      options:
        - label: I have verified this issue occurs on the latest available package version.
          required: true
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have confirmed no secrets or private tokens are included in the logs above.
          required: true
