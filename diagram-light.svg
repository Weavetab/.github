<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b949e"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <!-- background to match GitHub dark (#0d1117) -->
  <rect width="760" height="440" fill="#0d1117"/>

  <!-- @weavetab/skills (dashed) -->
  <rect x="10" y="28" width="180" height="44" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="100" y="47" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3">@weavetab/skills</text>
  <text x="100" y="63" text-anchor="middle" font-size="10" fill="#8b949e">pre-built flows</text>
  <!-- Arrow: skills → Agent -->
  <line x1="190" y1="50" x2="278" y2="50" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- AI Agent -->
  <rect x="280" y="20" width="200" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="380" y="47" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">AI Agent</text>
  <text x="380" y="65" text-anchor="middle" font-size="10" fill="#8b949e">Claude · GPT · any MCP client</text>

  <!-- Arrow: Agent → MCP Server -->
  <line x1="380" y1="80" x2="380" y2="158" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="393" y="122" font-size="10" fill="#8b949e">MCP · stdio / SSE</text>

  <!-- WeaveTab MCP Server (blue accent) -->
  <rect x="180" y="160" width="400" height="70" rx="6" fill="#0c2d6b" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="380" y="191" text-anchor="middle" font-size="13" font-weight="600" fill="#58a6ff">WeaveTab MCP Server</text>
  <text x="380" y="213" text-anchor="middle" font-size="10" fill="#79c0ff">tool router · session registry · CDP bridge</text>

  <!-- @weavetab/sdk (dashed) -->
  <rect x="600" y="173" width="150" height="44" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="675" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3">@weavetab/sdk</text>
  <text x="675" y="208" text-anchor="middle" font-size="10" fill="#8b949e">extend · build</text>
  <!-- Arrow: sdk → MCP Server -->
  <line x1="600" y1="195" x2="582" y2="195" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Arrow: MCP Server → fan-out -->
  <line x1="380" y1="230" x2="380" y2="295" stroke="#8b949e" stroke-width="1.5"/>
  <text x="393" y="266" font-size="10" fill="#8b949e">Chrome DevTools Protocol</text>

  <!-- Horizontal distributor -->
  <line x1="145" y1="295" x2="615" y2="295" stroke="#8b949e" stroke-width="1.5"/>

  <!-- Verticals to browsers -->
  <line x1="145" y1="295" x2="145" y2="348" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="380" y1="295" x2="380" y2="348" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="615" y1="295" x2="615" y2="348" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Chrome -->
  <rect x="70" y="350" width="150" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="145" y="377" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Chrome</text>
  <text x="145" y="396" text-anchor="middle" font-size="10" fill="#8b949e">Chromium-based</text>

  <!-- Edge -->
  <rect x="305" y="350" width="150" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="380" y="377" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Edge</text>
  <text x="380" y="396" text-anchor="middle" font-size="10" fill="#8b949e">Chromium-based</text>

  <!-- Brave -->
  <rect x="540" y="350" width="150" height="60" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="615" y="377" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Brave</text>
  <text x="615" y="396" text-anchor="middle" font-size="10" fill="#8b949e">Chromium-based</text>
</svg>
